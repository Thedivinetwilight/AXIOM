[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena"
version = "3.7.0a10"
description = "AXIOM multi-market local paper & gated operator platform (NSE Upstox + NASDAQ Alpaca)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.46,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "websockets>=14,<16",
    "protobuf>=5.29,<7",
    "python-dotenv>=1,<2",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
axiom-operator = "app.source_launcher:cli_main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*", "desktop*"]
exclude = ["app.tests*", "tests*"]
