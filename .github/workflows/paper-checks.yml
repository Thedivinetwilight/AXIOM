name: paper checks

# This branch carries the chart terminal plus the read-only Alpaca US
# market-data path. Both jobs are paper-only: nothing here configures a broker,
# reaches an exchange, or needs a credential (the Alpaca tests use a fake
# transport and fake keys).
on:
  push:
    branches:
      - arena/5ed3f6b6-axiom
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: focused (chart + US paper)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: US market data, New York calendar and paper limits
        run: python -m pytest -q tests/test_us_equities_paper.py tests/test_us_chart_integration.py
      - name: chart terminal contract tests
        run: python -m pytest -q tests/test_chart_terminal.py
      - name: chart script executes headlessly
        run: |
          node --check app/static/chart/chart.js
          node tests/js/chart_smoke.mjs

  full:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: full test suite
        run: python -m pytest -q
      - name: chart harness (fixture payload)
        run: node tests/js/chart_smoke.mjs
