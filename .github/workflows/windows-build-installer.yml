name: Windows Build and Installer (paper recovery)

on:
  push:
    branches:
      - arena/f97e3dd9-axiom
    paths:
      - "app/**"
      - "arena.py"
      - "build_exe.py"
      - "packaging/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/windows-build-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-install:
    name: Windows executable, installer, and recovery E2E
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify JavaScript runtime
        shell: bash
        run: node --version

      - name: Full Windows test suite (hard gate)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --no-header -k "not slow" \
            --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt

      - name: Build and test the real frozen executable (hard gate)
        id: frozen-build
        shell: bash
        run: |
          set -o pipefail
          python -u build_exe.py --test 2>&1 | tee frozen-build-output.txt

      - name: Upload frozen-build diagnostics on failure
        if: failure() && steps.frozen-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-build-diagnostics-${{ github.run_number }}
          path: |
            frozen-build-output.txt
            build/recovery-e2e-workdir/frozen-recovery.log
          if-no-files-found: warn
          retention-days: 3

      - name: Report frozen-build failure details
        if: failure() && steps.frozen-build.outcome == 'failure'
        shell: bash
        run: |
          if [ -f frozen-build-output.txt ]; then
            details=$(grep -E 'FAIL|ERROR|Traceback|RuntimeError|SMOKE TEST FAILED' \
              frozen-build-output.txt | tail -n 30 || true)
            if [ -z "$details" ]; then
              details=$(tail -n 30 frozen-build-output.txt)
            fi
            {
              echo "## Frozen-build failure details"
              echo
              echo '```text'
              printf '%s\n' "$details"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$details" | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              printf '::error title=Frozen build diagnostic::%s\n' "$safe"
            done
          else
            echo "::error title=Frozen build diagnostics::frozen-build-output.txt was not created"
          fi

      - name: Prepare executable artifact and checksum
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib

          source = pathlib.Path("dist/Arena.exe")
          if not source.is_file():
              raise SystemExit("dist/Arena.exe is missing")
          release = pathlib.Path("release")
          release.mkdir(exist_ok=True)
          target = release / "Arena.exe"
          target.write_bytes(source.read_bytes())
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (release / "SHA256SUMS-windows-x64.txt").write_text(
              f"{digest}  Arena.exe\n", encoding="utf-8")
          metadata = json.loads(pathlib.Path("app/BUILD_META.json").read_text(
              encoding="utf-8"))
          if metadata.get("commit") != "${{ github.sha }}":
              raise SystemExit("Frozen build commit does not match this push")
          record = {
              "artifact": "Arena.exe",
              "version": metadata.get("version"),
              "commit": metadata.get("commit"),
              "build_id": f"{metadata.get('version')}-{metadata.get('commit', '')[:10]}",
              "built_at": metadata.get("built_at"),
              "platform": metadata.get("platform"),
              "size_bytes": target.stat().st_size,
              "sha256": digest,
          }
          (release / "Arena.exe.build-info.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8")
          print(f"Arena.exe bytes: {record['size_bytes']}")
          print(f"Arena.exe SHA-256: {digest}")
          print(f"Build commit: {record['commit']}")
          PY

      - name: Upload verified Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-Arena-Windows-x64
          path: |
            release/Arena.exe
            release/SHA256SUMS-windows-x64.txt
            release/Arena.exe.build-info.json
          if-no-files-found: error
          retention-days: 90

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup 6 compiler not found after installation"
            exit 1
          }
          Write-Host "Inno Setup compiler is ready."

      - name: Build the real setup installer
        shell: bash
        run: python packaging/build_installer.py

      - name: Install, recover, restart, and uninstall the packaged setup (hard gate)
        id: installer-e2e
        shell: bash
        run: |
          set -o pipefail
          python -u packaging/installer_e2e.py release/AXIOM-Setup.exe \
            build/installer-e2e 2>&1 | tee installer-e2e-output.txt

      - name: Upload installer-test diagnostics on failure
        if: failure() && steps.installer-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: installer-e2e-diagnostics-${{ github.run_number }}
          path: |
            installer-e2e-output.txt
            build/installer-e2e/recovery-test/frozen-recovery.log
          if-no-files-found: warn
          retention-days: 3

      - name: Report installer-test failure details
        if: failure() && steps.installer-e2e.outcome == 'failure'
        shell: bash
        run: |
          if [ -f installer-e2e-output.txt ]; then
            details=$(grep -E 'FAIL|ERROR|Traceback|Exception|SMOKE TEST FAILED' \
              installer-e2e-output.txt | tail -n 30 || true)
            if [ -z "$details" ]; then
              details=$(tail -n 30 installer-e2e-output.txt)
            fi
            {
              echo "## Installer-test failure details"
              echo
              echo '```text'
              printf '%s\n' "$details"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$details" | while IFS= read -r line; do
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              printf '::error title=Installer test diagnostic::%s\n' "$safe"
            done
          else
            echo "::error title=Installer test diagnostics::installer-e2e-output.txt was not created"
          fi

      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-Setup-Windows-x64
          path: |
            release/AXIOM-Setup.exe
            release/SHA256SUMS-installer.txt
          if-no-files-found: error
          retention-days: 90

      - name: Summarize Windows artifacts and hashes
        if: always()
        shell: bash
        run: |
          {
            echo "## Windows build and installer"
            echo
            echo "- Full Windows suite: **${{ job.status }}**"
            if [ -f release/SHA256SUMS-windows-x64.txt ]; then
              echo "- Executable checksum: \`$(cat release/SHA256SUMS-windows-x64.txt)\`"
            fi
            if [ -f release/SHA256SUMS-installer.txt ]; then
              echo "- Installer checksum: \`$(cat release/SHA256SUMS-installer.txt)\`"
            fi
            echo "- The frozen recovery E2E exercises startup refusal, the explicit new-paper-database flow, restart, and local UI against the installed executable."
          } >> "$GITHUB_STEP_SUMMARY"
