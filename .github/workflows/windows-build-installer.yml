name: Windows build and installer

# The installed-Windows path is a separate gate from the ordinary source
# suite. A packaged Arena is a different runtime: one-file extraction, its
# own per-user data directory, a console that closes when the process exits.
#
# This workflow is the ONLY place where the real Windows artifacts are
# produced and exercised:
#
#   1. source suite          the full suite on Windows (hard gate);
#   2. executable            build_exe.py produces dist\Arena.exe;
#   3. frozen gates          build_exe.py --test starts the ACTUAL artifact
#                            and drives it through the wizard flow, the
#                            restart recovery and the duplicate launch;
#   4. paper recovery        the ACTUAL artifact is driven through the
#                            reported startup failure: it must refuse with
#                            exit code 3, keep the saved account, recover
#                            into a separate empty account and start again
#                            (hard gate);
#   5. installer             the Inno Setup package is built and then
#                            INSTALLED silently, the installed executable is
#                            driven through the same recovery, and the
#                            uninstaller is run to prove the user's data
#                            survives (hard gate);
#   6. artifacts             uploaded ONLY after every gate above passed.
#
# Any failure discards the artifact. No exceptions, no continue-on-error.
#
# The Inno Setup compiler is RESOLVED, not assumed: the Windows runner image
# already ships Inno Setup, and a pinned `choco install --version=...`
# refuses to downgrade it, which used to kill this workflow before a single
# test ran. packaging/prepare_innosetup.py detects the installed compiler
# and verifies it, and installs one explicitly when there is none.

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - "arena.py"
      - "run.py"
      - "build_exe.py"
      - "packaging/**"
      - "docs/**"
      - "tests/test_paper_database_recovery.py"
      - "tests/test_windows_portability.py"
      - "tests/test_packaging_single_exe.py"
      - ".github/workflows/windows-build-installer.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable and installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve and verify the Inno Setup compiler (hard gate)
        shell: bash
        run: |
          set -o pipefail
          python packaging/prepare_innosetup.py --install --github-env "$GITHUB_ENV"

      - name: Full source suite on Windows (hard gate)
        id: fullsuite
        shell: pwsh
        run: |
          python -m pytest -q --no-header -k "not slow" --junitxml=pytest-results.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report Windows suite failures
        if: failure() && steps.fullsuite.outcome == 'failure'
        shell: pwsh
        run: |
          if (Test-Path pytest-results.xml) {
            python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-results.xml").getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is not None:
                  name = (case.get("classname", "") + "::" +
                          case.get("name", "unknown"))
                  message = " ".join((failure.get("message") or
                                      failure.text or "").split())[:350]
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Pytest failure::{name} - {message}")
          PY
          }

      - name: Build the Windows executable
        shell: bash
        run: |
          set -o pipefail
          python build_exe.py
          if [ ! -f dist/Arena.exe ]; then echo "::error::dist\\Arena.exe was not produced"; exit 1; fi

      - name: Frozen gates on the real artifact (hard gate)
        id: frozen
        shell: bash
        run: |
          set -o pipefail
          python -u build_exe.py --test 2>&1 | tee frozen-build-output.txt

      - name: Report frozen-gate failures
        if: failure() && steps.frozen.outcome == 'failure'
        shell: bash
        run: |
          if [ -f frozen-build-output.txt ]; then
            grep -E "FAIL|ERROR|Traceback|RuntimeError|SMOKE TEST FAILED" frozen-build-output.txt \
              | tail -n 30 || true
          else
            echo "::error::frozen-build-output.txt was not created"
          fi

      - name: Build the installer (hard gate)
        id: installer
        shell: bash
        run: |
          set -o pipefail
          python -u packaging/build_installer.py --verify 2>&1 | tee installer-build-output.txt
          if [ ! -d dist/installer ]; then echo "::error::no installer directory was produced"; exit 1; fi
          ls -l dist/installer

      - name: Report installer-build failures
        if: failure() && steps.installer.outcome == 'failure'
        shell: bash
        run: |
          if [ -f installer-build-output.txt ]; then
            tail -n 40 installer-build-output.txt || true
          else
            echo "::error::installer-build-output.txt was not created"
          fi

      - name: Install, exercise and uninstall (hard gate)
        id: installere2e
        shell: bash
        run: |
          set -o pipefail
          installer="$(ls -1 dist/installer/*.exe | head -n 1)"
          if [ -z "$installer" ]; then echo "::error::no installer was produced"; exit 1; fi
          python -u packaging/installer_e2e.py "$installer" build/installer-e2e \
            2>&1 | tee installer-e2e-output.txt

      - name: Report installer-test failures
        if: failure() && steps.installere2e.outcome == 'failure'
        shell: bash
        run: |
          if [ -f installer-e2e-output.txt ]; then
            grep -E "FAIL|ERROR|Traceback|Exception" installer-e2e-output.txt \
              | tail -n 30 || true
          else
            echo "::error::installer-e2e-output.txt was not created"
          fi

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-diagnostics-${{ github.run_number }}
          path: |
            pytest-results.xml
            pytest-output.txt
            frozen-build-output.txt
            installer-build-output.txt
            installer-e2e-output.txt
            build/recovery-e2e-workdir/**
            build/installer-e2e/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the Windows artifacts
        # Only after every gate above passed: a failed run must not publish
        # an artifact that was never verified.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arena-windows-x64
          path: |
            dist/Arena.exe
            dist/installer/*.exe
          if-no-files-found: error
          retention-days: 90
