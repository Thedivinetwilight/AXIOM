name: AXIOM Windows executable pair

on:
  push:
    branches:
      - arena/f97e3dd9-axiom
    paths:
      - "axiom/**"
      - "desktop/**"
      - "tools/build_windows_executables.py"
      - "tools/kronos_executable_e2e.py"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "requirements-kronos.txt"
      - "tests/test_kronos_*.py"
      - "tests/test_v2_desktop.py"
      - "tests/test_final_api_desktop.py"
      - "tests/test_risk_numeric_guards.py"
      - "tests/test_live_config_check.py"
      - ".github/workflows/kronos-windows-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pair:
    name: Isolated GUI and Kronos executables, Windows E2E
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-kronos.txt

      - name: Install test and Kronos build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-kronos.txt pyinstaller

      - name: Create a PyTorch-free GUI build environment
        shell: bash
        run: |
          python -m venv .venv-desktop
          .venv-desktop/Scripts/python.exe -m pip install --upgrade pip
          .venv-desktop/Scripts/python.exe -m pip install \
            -r requirements.txt -r requirements-desktop.txt pyinstaller
          .venv-desktop/Scripts/python.exe -c \
            "import importlib.util; assert importlib.util.find_spec('torch') is None, 'PyTorch leaked into GUI build environment'"

      - name: Run risk, numeric, desktop, and Kronos regressions
        shell: bash
        run: |
          python -m pytest -q --no-header \
            tests/test_risk_numeric_guards.py \
            tests/test_live_config_check.py \
            tests/test_v2_desktop.py \
            tests/test_final_api_desktop.py \
            tests/test_kronos_artifacts.py \
            tests/test_kronos_end_to_end.py \
            tests/test_kronos_input_contract.py \
            tests/test_kronos_market_data.py \
            tests/test_kronos_packaging.py \
            tests/test_kronos_pipeline_store.py \
            tests/test_kronos_research.py \
            tests/test_kronos_runtime.py \
            tests/test_kronos_safety.py \
            tests/test_kronos_ui.py \
            tests/test_kronos_worker.py

      - name: Build both Windows executables from isolated environments
        shell: bash
        run: |
          python -u tools/build_windows_executables.py --clean \
            --desktop-python .venv-desktop/Scripts/python.exe \
            --kronos-python python

      - name: Smoke-test the actual AXIOM desktop executable
        env:
          QT_QPA_PLATFORM: offscreen
          ARENA_BACKEND_URL: http://127.0.0.1:1
          ARENA_API_TOKEN: ""
          AXIOM_KRONOS_ENABLED: "false"
          MODE: PAPER
          LIVE_TRADING: "false"
          BROKER: LOCAL_PAPER
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          executable = Path("dist/AXIOM.exe")
          if not executable.is_file():
              raise SystemExit(f"missing desktop executable: {executable}")
          result = subprocess.run(
              [str(executable), "--smoke"], timeout=90, check=False)
          if result.returncode:
              raise SystemExit(f"AXIOM.exe --smoke exited {result.returncode}")
          print("PASS: frozen AXIOM GUI initialized and closed (offscreen)")
          PY

      - name: Smoke-test frozen GUI to sibling Kronos lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
          ARENA_BACKEND_URL: http://127.0.0.1:1
          ARENA_API_TOKEN: ""
          MODE: PAPER
          LIVE_TRADING: "false"
          BROKER: LOCAL_PAPER
          AXIOM_KRONOS_ENABLED: "true"
          AXIOM_KRONOS_BACKEND: stub
          AXIOM_KRONOS_ALLOW_DOWNLOAD: "false"
          AXIOM_KRONOS_MODE: process
          AXIOM_MARKET_DATA_SOURCE: http
          AXIOM_MARKET_DATA_URL: http://127.0.0.1:1/{instrument}/{timeframe}
          AXIOM_MARKET_DATA_TIMEFRAME: 1m
          AXIOM_FORECAST_SERIES: ""
          AXIOM_MODEL_CACHE: "${{ runner.temp }}/axiom-kronos-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          executable = Path("dist/AXIOM.exe").resolve()
          result = subprocess.run(
              [str(executable), "--kronos-smoke"], timeout=160,
              capture_output=True, text=True, check=False)
          if result.stdout:
              print(result.stdout, end="")
          if result.returncode:
              if result.stderr:
                  print(result.stderr, end="")
              raise SystemExit(
                  f"frozen GUI/Kronos smoke exited {result.returncode}")
          lines = [line.partition(" ")[2] for line in result.stdout.splitlines()
                   if line.startswith("AXIOM_KRONOS_SMOKE ")]
          if len(lines) != 1:
              raise SystemExit("GUI did not emit exactly one Kronos lifecycle report")
          report = json.loads(lines[0])
          sibling = Path(report["command"][0]).resolve()
          if (report.get("ok") is not True
                  or report.get("state") != "READY"
                  or report.get("backend") != "stub"
                  or report.get("transport") != "frozen sibling process"
                  or report.get("shutdown") != "clean (exit 0)"
                  or sibling.parent != executable.parent
                  or sibling.name.lower() != "axiom-kronos.exe"
                  or report.get("forecast_inference") != "NOT RUN"):
              raise SystemExit("frozen GUI/Kronos lifecycle evidence is incomplete: "
                               + json.dumps(report, sort_keys=True))
          print("PASS: frozen AXIOM GUI loaded/statused/shut down its sibling "
                "AXIOM-Kronos.exe using the explicit stub backend; no forecast "
                "inference or model weights were used")
          PY

      - name: Smoke-test the actual AXIOM-Kronos process and JSON-lines IPC
        shell: bash
        run: python tools/kronos_executable_e2e.py dist/AXIOM-Kronos.exe

      - name: Record Windows pair hashes and sizes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          records = []
          for name in ("AXIOM.exe", "AXIOM-Kronos.exe"):
              path = Path("dist") / name
              if not path.is_file():
                  raise SystemExit(f"missing built executable: {path}")
              digest = hashlib.sha256()
              with path.open("rb") as executable:
                  for chunk in iter(lambda: executable.read(8 * 1024 * 1024), b""):
                      digest.update(chunk)
              records.append({"file": name, "size_bytes": path.stat().st_size,
                              "sha256": digest.hexdigest()})
          output = Path("dist/AXIOM-Windows-pair.build-info.json")
          output.write_text(json.dumps({
              "platform": "Windows x64",
              "verification": "GUI smoke + frozen GUI-to-sibling Kronos stub load/status/shutdown + labelled-stub worker IPC smoke",
              "real_pretrained_inference": "NOT VERIFIED; weights are not bundled",
              "executables": records,
          }, indent=2) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY

      - name: Upload the verified Windows executable pair
        uses: actions/upload-artifact@v4
        with:
          name: AXIOM-Windows-executable-pair
          path: |
            dist/AXIOM.exe
            dist/AXIOM-Kronos.exe
            dist/AXIOM-Windows-pair.build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
