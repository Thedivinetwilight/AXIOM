name: windows release

# Builds, tests, install-tests and publishes the Windows x64 executable and
# installer for one exact source commit.
#
# The commit to build is named in packaging/windows/BUILD_TARGET, so a push that
# changes that file (or this workflow) triggers a build of precisely that commit.
# workflow_dispatch can override it when the token has Actions write permission.
#
# How the two trees are used:
#   _kit/  the branch this workflow runs on -> packaging files only
#   src/   the source commit being built    -> application code only
# The kit is copied into src/packaging and excluded via src/.git/info/exclude,
# so the build's "is the tree clean" guard still holds and the built code is
# exactly the requested commit.
#
# Paper only: the smoke tests use generated local tokens and the bundled DEMO
# data. No broker is contacted and no live credential is used.

on:
  push:
    branches:
      - arena/5ed3f6b6-axiom
    paths:
      - 'packaging/windows/BUILD_TARGET'
      - 'packaging/windows/VERSION'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA (blank = BUILD_TARGET file)
        required: false
        default: ''
        type: string
      version:
        description: Version label (blank = VERSION file)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    name: build + install-test (windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the packaging kit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _kit
          fetch-depth: 1

      - name: Resolve the target commit and version
        id: resolve
        shell: pwsh
        run: |
          $target = '${{ inputs.commit }}'.Trim()
          $version = '${{ inputs.version }}'.Trim()
          if (-not $target) { $target = (Get-Content _kit/packaging/windows/BUILD_TARGET -Raw).Trim() }
          if (-not $version) { $version = (Get-Content _kit/packaging/windows/VERSION -Raw).Trim() }
          if ($target -notmatch '^[0-9a-f]{40}$') { throw "invalid commit '$target'" }
          "TARGET_COMMIT=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TARGET_COMMIT=$target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "target commit: $target"
          Write-Host "version:       $version"

      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.TARGET_COMMIT }}
          path: src
          fetch-depth: 0

      - name: Stage the kit without dirtying the source tree
        shell: pwsh
        run: |
          if (-not (Test-Path _kit/packaging/windows)) { throw 'the packaging kit is missing from the branch' }
          Copy-Item -Recurse -Force _kit/packaging src/packaging
          Add-Content -Path src/.git/info/exclude -Value 'packaging/'
          Push-Location src
          $sha = (git rev-parse HEAD).Trim()
          $dirty = (git status --porcelain | Out-String).Trim()
          Pop-Location
          if ($sha -ne $env:TARGET_COMMIT) { throw "checked out $sha, expected $env:TARGET_COMMIT" }
          if ($dirty) { throw "source tree is dirty after staging the kit:`n$dirty" }
          Write-Host "source commit verified and clean: $sha"

      - name: Build, test and package
        shell: pwsh
        working-directory: src/packaging/windows
        run: ./build_windows.ps1 -ExpectedCommit "$env:TARGET_COMMIT" -Version "$env:VERSION"

      - name: Verify the produced artifacts
        shell: pwsh
        working-directory: src/packaging/windows
        run: |
          $meta = Get-Content dist\BUILD_METADATA.json -Raw | ConvertFrom-Json
          if ($meta.commit -ne $env:TARGET_COMMIT) { throw "metadata commit $($meta.commit) != $env:TARGET_COMMIT" }
          foreach ($a in $meta.artifacts) {
            $path = Join-Path dist $a.name
            if (-not (Test-Path $path)) { throw "missing artifact $($a.name)" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLower()
            if ($hash -ne $a.sha256) { throw "hash mismatch for $($a.name)" }
            Write-Host ("verified {0}  {1}" -f $a.name, $hash)
          }
          if ($meta.test_results.smoke_failed -ne 0) { throw "smoke failures: $($meta.test_results.smoke_failed)" }
          Write-Host "smoke checks passed: $($meta.test_results.smoke_checks.Count)"

      - name: Install the installer, launch the installed copy, then uninstall
        shell: pwsh
        working-directory: src/packaging/windows
        run: |
          $ErrorActionPreference = 'Stop'
          function Phase($n, $msg) { Write-Host "::notice title=install-test panel $n::$msg"; Write-Host "== $n: $msg" }
          $script:phase = 'init'
          try {
            Phase 1 'locate the installer'
            $script:phase = 'locate installer'
            $setup = (Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1).FullName
            if (-not $setup) { throw 'no *-setup.exe in dist' }
            Write-Host "installer: $setup ($([math]::Round((Get-Item $setup).Length/1MB,1)) MB)"

            $dir = Join-Path $env:LOCALAPPDATA 'Programs\AXIOM-Chart'
            $installed = Join-Path $dir 'AXIOM-Chart.exe'
            $log = Join-Path $env:TEMP 'axiom-install.log'
            Write-Host "install dir: $dir"

            Phase 2 'silent install'
            $script:phase = 'silent install'
            $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir","/LOG=$log")
            Write-Host "arguments: $($args -join ' ')"
            $proc = Start-Process -FilePath $setup -ArgumentList $args -PassThru -Wait
            Write-Host "installer exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log -Tail 60 | ForEach-Object { Write-Host "  log| $_" } }
              throw "installer exited with code $($proc.ExitCode)"
            }

            Phase 3 'verify the installed files'
            $script:phase = 'verify installed files'
            for ($i = 0; $i -lt 40 -and -not (Test-Path $installed); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $installed)) {
              if (Test-Path $dir) { Get-ChildItem $dir | ForEach-Object { Write-Host "  found| $($_.Name)" } }
              else { Write-Host "  $dir does not exist" }
              $other = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Filter 'AXIOM-Chart.exe' -ErrorAction SilentlyContinue -Depth 4 | Select-Object -First 3
              foreach ($o in $other) { Write-Host "  elsewhere| $($o.FullName)" }
              throw "AXIOM-Chart.exe was not installed into $dir"
            }
            Write-Host "installed: $installed"

            Phase 4 'launch the installed copy'
            $script:phase = 'launch installed copy'
            $env:AXIOM_DATA_DIR = Join-Path $env:TEMP ('axiom-installed-' + [guid]::NewGuid().ToString('N'))
            $env:AXIOM_PORT = '8135'
            $outLog = Join-Path $env:TEMP 'axiom-installed-out.log'
            $errLog = Join-Path $env:TEMP 'axiom-installed-err.log'
            $p = Start-Process -FilePath $installed -ArgumentList '--no-browser' -PassThru -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            $ok = $false
            for ($i = 0; $i -lt 240; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { break }
              try { $null = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8135/health' -TimeoutSec 2; $ok = $true; break } catch { }
            }
            if (-not $ok) {
              Write-Host "exited=$($p.HasExited) code=$(if ($p.HasExited) { $p.ExitCode } else { 'running' })"
              foreach ($f in @($outLog, $errLog)) { if (Test-Path $f) { Write-Host "--- $f"; Get-Content $f -Tail 40 | ForEach-Object { Write-Host "  app| $_" } } }
              if (-not $p.HasExited) { $p.Kill() }
              throw 'the installed application never answered /health'
            }
            Write-Host 'installed copy answered /health'

            Phase 5 'chart page and static assets from the installed copy'
            $script:phase = 'installed chart page'
            $chart = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8135/chart' -TimeoutSec 15
            if ($chart.StatusCode -ne 200) { throw "/chart returned $($chart.StatusCode)" }
            if ($chart.Content -notmatch 'PAPER') { throw 'the chart page does not show the PAPER badge' }
            Write-Host '/chart 200 and displays PAPER'
            $js = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8135/static/chart/chart.js' -TimeoutSec 15
            if ($js.StatusCode -ne 200) { throw 'chart.js is missing from the installed copy' }
            Write-Host "static chart.js served ($($js.RawContentLength) bytes)"
            $anon = 0
            try { $null = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8135/chart/data?symbol=DEMO&timeframe=1D' -TimeoutSec 5 }
            catch { $anon = [int]$_.Exception.Response.StatusCode }
            if ($anon -ne 401) { throw "a data route answered without a token ($anon)" }
            Write-Host 'data route still requires the token (401 without it)'

            Phase 6 'shut down and uninstall'
            $script:phase = 'uninstall'
            $p.Kill()
            $p.WaitForExit(10000) | Out-Null
            Start-Sleep -Seconds 3
            $uninstaller = Join-Path $dir 'unins000.exe'
            if (-not (Test-Path $uninstaller)) { throw 'the uninstaller was not installed' }
            $u = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
            Write-Host "uninstaller exit code: $($u.ExitCode)"
            for ($i = 0; $i -lt 40 -and (Test-Path $installed); $i++) { Start-Sleep -Milliseconds 500 }
            if (Test-Path $installed) {
              Get-ChildItem $dir | ForEach-Object { Write-Host "  left| $($_.Name)" }
              throw 'uninstall left AXIOM-Chart.exe behind'
            }
            if (-not (Test-Path $env:AXIOM_DATA_DIR)) { throw 'uninstall deleted the user data folder; it must be preserved' }
            Write-Host 'uninstall removed the program files and kept the user data folder'

            Write-Host '::notice title=install-test::PASS - install, launch, /chart, static assets, token gate and uninstall verified'
          }
          catch {
            $msg = "$_"
            Write-Host "::error title=install-test failed in phase '$script:phase'::$msg"
            Set-Content -Path (Join-Path 'dist' 'INSTALL_TEST_ERROR.txt') -Value "phase: $script:phase`n$msg" -Encoding utf8
            exit 1
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-chart-windows-x64-${{ steps.resolve.outputs.VERSION }}
          path: |
            src/packaging/windows/dist/*.exe
            src/packaging/windows/dist/BUILD_METADATA.json
            src/packaging/windows/dist/SHA256SUMS.txt
            src/packaging/windows/dist/SOURCE_COMMIT.txt
            src/packaging/windows/dist/install-test-log.txt
            src/packaging/windows/WINDOWS_INSTALL_MANUAL.md
            src/packaging/windows/pytest-full.log
            src/packaging/windows/pytest-focused.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the prerelease
        if: success()
        shell: pwsh
        working-directory: src/packaging/windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $meta = Get-Content dist\BUILD_METADATA.json -Raw | ConvertFrom-Json
          $tag = "v$($env:VERSION)"
          $passed = $meta.test_results.smoke_checks.Count - $meta.test_results.smoke_failed
          $notes = @"
          Windows x64 build of AXIOM at commit ``$($meta.commit)``.

          **Paper only.** ``MODE=PAPER``, ``LIVE_TRADING=false`` and ``BROKER=LOCAL_PAPER`` are
          enforced when settings load and re-checked by the launcher. The package contains
          no live broker client and no live order endpoint; every fill is simulated locally.

          **Test results on this runner:** focused suites ``$($meta.test_results.focused_windows)``,
          full suite ``$($meta.test_results.full_windows)`` (``$($meta.test_results.full_summary)``),
          ``$passed`` on-machine checks passed, plus a silent install / launch / /chart /
          uninstall cycle of the produced installer.

          No strategy in this build is profitable, validated or ready for real money.
          "@
          $assets = @(
            (Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1).FullName
            (Join-Path (Get-Location) 'dist\AXIOM-Chart.exe')
            (Join-Path (Get-Location) 'dist\BUILD_METADATA.json')
            (Join-Path (Get-Location) 'dist\SHA256SUMS.txt')
            (Join-Path (Get-Location) 'dist\install-test-log.txt')
            (Join-Path (Get-Location) 'WINDOWS_INSTALL_MANUAL.md')
          )
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "tag $tag exists; replacing that prerelease"
            gh release delete $tag --yes --cleanup-tag
          }
          gh release create $tag --prerelease --target $meta.commit `
            --title "AXIOM chart terminal + US paper data $($env:VERSION) (Windows x64)" `
            --notes $notes @assets
          Write-Host "published $tag"
