            (Join-Path (Get-Location) '..\..\docs\RESEARCH_CANDIDATES.md')
            (Join-Path (Get-Location) '..\..\docs\TERMINAL_PERFORMANCE.md')
            (Join-Path (Get-Location) '..\..\docs\TERMINAL_REDESIGN_PLAN.md')
            (Join-Path (Get-Location) '..\..\docs\WINDOWS_APP_CONTROL.md')
            (Join-Path (Get-Location) '..\..\docs\AUTONOMY.md')
            (Join-Path (Get-Location) '..\..\docs\ARCHITECTURE_AUDIT.md')
            (Join-Path (Get-Location) '..\..\docs\autonomy-shakedown.template.json')
          )
          # The manifest is uploaded too, but cannot contain its own hash.
          $assetNames = @($assets | ForEach-Object { Split-Path $_ -Leaf } | Where-Object { $_ -ne 'SHA256SUMS.txt' })
          $sumNames = @($sums | ForEach-Object { ($_ -split '  ', 2)[1] })
          if ($assetNames.Count -ne $sumNames.Count -or
              @($assetNames | Sort-Object -Unique).Count -ne $assetNames.Count -or
              @($sumNames | Sort-Object -Unique).Count -ne $sumNames.Count) {
            throw 'release assets and checksum manifest must be unique and one-to-one'
          }
          foreach ($name in $assetNames) {
            if ($sumNames -notcontains $name) { throw "release asset is not checksummed: $name" }
          }
          foreach ($name in $sumNames) {
            if ($assetNames -notcontains $name) { throw "checksummed file is not a release asset: $name" }
          }
          foreach ($a in $assets) { if (-not (Test-Path $a)) { throw "missing release asset $a" } }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "refusing to replace existing release/tag $tag; choose a new prerelease version"
          }
          gh release create $tag --prerelease --target $meta.commit `
            --title "AXIOM Operator $($env:VERSION) (PAPER-only Windows x64 candidate)" `
            --notes $notes @assets
          $published = gh release view $tag --json targetCommitish,assets,url | ConvertFrom-Json
          if ($published.targetCommitish -ne $meta.commit) { throw "release target $($published.targetCommitish) != $($meta.commit)" }
          $verifyDir = Join-Path $env:TEMP ('axiom-release-verify-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verifyDir | Out-Null
          gh release download $tag --dir $verifyDir
          foreach ($line in $sums) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "invalid checksum line $line" }
            $expectedHash = $Matches[1]; $name = $Matches[2]
            $downloaded = Join-Path $verifyDir $name
            if (-not (Test-Path $downloaded)) { throw "uploaded asset missing after download: $name" }
            $actualHash = (Get-FileHash -Algorithm SHA256 $downloaded).Hash.ToLower()
            if ($actualHash -ne $expectedHash) { throw "uploaded asset hash mismatch: $name" }
          }
          Write-Host "published and download-verified $tag"
          Write-Host $published.url
